<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
</style><link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: one-column phone board. Sticky week bar + day strip, then the day's slabs (A / B / notes) like a gym whiteboard. Plate colours mark A and B. */
:root{
  --bg:#eceef1; --surface:#ffffff; --ink:#14181d; --muted:#5a6370; --line:#d3d8df;
  --blue:#1f4fa8; --red:#c0392b; --yellow:#b88a00; --green:#2e7a48;
  --accent:var(--blue); --accent-soft:#dfe7f5; --on-accent:#ffffff;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101317; --surface:#181c22; --ink:#e9ecf0; --muted:#97a1ad; --line:#2a3039;
  --blue:#5b8de6; --red:#e8695c; --yellow:#e2b62e; --green:#5bb47c;
  --accent-soft:#1d2a40; --on-accent:#0d1117; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101317; --surface:#181c22; --ink:#e9ecf0; --muted:#97a1ad; --line:#2a3039;
  --blue:#5b8de6; --red:#e8695c; --yellow:#e2b62e; --green:#5bb47c;
  --accent-soft:#1d2a40; --on-accent:#0d1117; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.top{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{min-width:0;font-family:var(--display);font-weight:800;font-size:clamp(17px,4.9vw,28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.02em;line-height:1;text-transform:uppercase}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:4px}
.tools{display:flex;gap:6px;align-items:center;flex-shrink:0}
select,button{font:inherit;color:var(--ink)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;max-width:96px}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:8px;width:36px;height:34px;display:grid;place-items:center;cursor:pointer}
.icon-btn:focus-visible,.day:focus-visible,.wk-btn:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.icon-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2}
.spin svg{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}

.weekbar{display:flex;align-items:center;gap:8px}
.wk-btn{background:none;border:0;padding:6px 8px;cursor:pointer;color:var(--muted);font-size:20px;line-height:1}
.wk-btn:disabled{opacity:.3;cursor:default}
.wk-mid{flex:1;min-width:0;text-align:center}
.wk-title{font-family:var(--display);font-weight:800;font-size:22px;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.wk-sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.wk-focus{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:11px;letter-spacing:.04em;text-transform:uppercase}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:5px 0 6px;cursor:pointer;display:grid;gap:1px;justify-items:center}
.day b{font-family:var(--display);font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.day span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.day.today{border-color:var(--accent)}
.day[aria-selected="true"]{background:var(--ink);border-color:var(--ink)}
.day[aria-selected="true"] b,.day[aria-selected="true"] span{color:var(--bg)}

main{display:grid;gap:12px;margin-top:6px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px}
.dayhead h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;text-transform:uppercase;margin:0;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.chip.focus{border-color:transparent;background:var(--accent);color:var(--on-accent)}

.slab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 16px;display:grid;grid-template-columns:auto 1fr;gap:12px;min-width:0}
.plate{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:#fff;box-shadow:inset 0 0 0 4px rgba(255,255,255,.18)}
.daypic{border-radius:12px;overflow:hidden;background:var(--line);aspect-ratio:16/9;max-width:100%}
.daypic img{display:block;width:100%;height:100%;object-fit:cover}
.plate.w{background:var(--muted)}.slab.warm .wod{font-size:15px}
.plate.a{background:var(--blue)}.plate.b{background:var(--red)}.plate.n{background:var(--yellow)}
.slab-body{min-width:0}
.slab-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.wod{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.55}
.wod .fmt{display:block;font-family:var(--display);font-weight:800;font-size:21px;text-transform:uppercase;letter-spacing:.02em;line-height:1.15;margin-bottom:4px}
.wod .load{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.notes .wod{font-size:14px;color:var(--ink)}
.notes .wod .hl{color:var(--green);font-weight:600}

.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.score{display:grid;gap:4px;min-width:0}
.score label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.score label .st{letter-spacing:0;text-transform:none;font-weight:500;color:var(--green)}
.score input{width:100%;min-width:0;font:inherit;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
.score input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.slab.tap{cursor:pointer}
.slab.open{border-color:var(--accent)}
.slab-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.slab-row .slab-label{margin:0}
.score-btn{font:inherit;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);border:0;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap}
.score-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.score-sum{font-size:13px;color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.score-sum:empty,.slab.open .score-sum{display:none}
.score-sum b{color:var(--ink)}
.slab .scores{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.score-hint{font-size:12px;color:var(--muted);margin-top:8px}
.empty,.banner{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:18px 16px;color:var(--muted);font-size:14px}
.banner{border-style:solid;border-color:var(--yellow);color:var(--ink)}
.banner b{display:block;margin-bottom:2px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin-top:8px;font-variant-numeric:tabular-nums}
.install{margin-top:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px 16px;font-weight:600;font-size:15px;cursor:pointer}
.install svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.install:focus-visible,.sheet button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sheet-bg{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:grid;gap:14px}
.sheet h2{font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;margin:0}
.sheet ol{margin:0;padding-left:20px;display:grid;gap:10px;font-size:15px}
.sheet .glyph{display:inline-block;vertical-align:-3px;width:18px;height:18px;stroke:var(--accent);fill:none;stroke-width:2}
.sheet button{background:var(--ink);color:var(--bg);border:0;border-radius:10px;padding:12px;font:inherit;font-weight:600;cursor:pointer}
.rm-btn{width:auto;padding:0 8px;font-family:var(--display);font-weight:800;font-size:14px;letter-spacing:.03em}
.pct{display:inline-block;margin-left:8px;vertical-align:1px;font:inherit;font-size:12px;font-weight:500;color:var(--muted);background:var(--accent-soft);border:0;border-radius:6px;padding:1px 7px;cursor:pointer;white-space:nowrap;font-variant-numeric:tabular-nums}
.pct b{color:var(--accent);font-weight:700}
.pct-set{color:var(--accent);font-weight:600}
.sheet.rm{max-height:85vh;overflow:auto}
.rm-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.rm-note{font-size:12px;color:var(--muted)}
.rm-grid{display:grid;grid-template-columns:minmax(0,1fr) 78px 78px;gap:6px 8px;align-items:center}
.rm-grid .h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:center}
.rm-grid label{font-size:14px;font-weight:500;min-width:0}
.rm-grid input{width:100%;font:inherit;font-size:16px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 4px}
.rm-grid input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.rm-grid input.hit{outline:2px solid var(--green)}
@media (prefers-reduced-motion:reduce){.spin svg{animation:none}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <div class="brand">CheezyWednesday<small id="cycleLabel">Programming</small></div>
      <div class="tools">
        <label for="tabSel" hidden>Cycle</label>
        <select id="tabSel" aria-label="Cycle"></select>
        <button class="icon-btn rm-btn" id="rmBtn" aria-label="1RMs">1RM</button>
        <button class="icon-btn" id="refresh" hidden aria-label="Refresh from sheet"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      </div>
    </div>
    <div class="weekbar">
      <button class="wk-btn" id="prevWk" aria-label="Previous week">‹</button>
      <div class="wk-mid"><div class="wk-title" id="wkTitle">Week –</div><div class="wk-sub" id="wkSub">Loading…</div></div>
      <button class="wk-btn" id="nextWk" aria-label="Next week">›</button>
    </div>
    <div class="days" id="days" role="tablist" aria-label="Days"></div>
  </header>
  <main id="main"><div class="empty">Loading this week's workouts…</div></main>
  <button class="install" id="installBtn" hidden><svg viewBox="0 0 24 24"><rect x="6" y="2" width="12" height="20" rx="2"/><path d="M12 8v6M9 11h6"/></svg>Add to Home Screen</button>
  <div class="foot" id="foot"></div>
</div>

<div class="sheet-bg" id="rmSheet" hidden>
  <div class="sheet rm" role="dialog" aria-modal="true" aria-labelledby="rmTitle">
    <div class="rm-head"><h2 id="rmTitle">1RMs</h2><span class="rm-note" id="rmNote">kg · % loads round to 2,5 kg</span></div>
    <div class="rm-grid" id="rmGrid"></div>
    <button id="rmClose">Done</button>
  </div>
</div>

<div class="sheet-bg" id="installSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Add to Home Screen</h2>
    <ol id="sheetSteps"></ol>
    <button id="sheetClose">Got it</button>
  </div>
</div>

<script>
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const DAY_NAMES = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const $ = id => document.getElementById(id);
const S = { tab:null, tabs:[], weeks:[], wi:0, di:0, updated:null, unsub:null, picked:false, error:null, scores:{}, scoreMode:"shared", maxes:{} };

const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const clean = v => String(v ?? "").replace(/^'/, "").replace(/\r/g,"").trim();
function parseDate(s){
  const m = clean(s).match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);
  return m ? new Date(+m[3], +m[2]-1, +m[1]) : null;
}
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const sameDay = (a,b) => a && b && a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
const fmt = d => d ? d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"}) : "";

function parseSheet(values){
  const weeks = []; let cur = null;
  for (let r = 0; r < values.length; r++){
    const row = values[r] || []; const a = clean(row[0]);
    if (/^\d{1,2}$/.test(a)){
      cur = { no:+a, rows:{}, dates:[] }; weeks.push(cur);
      const next = values[r+1] || [];
      if (!clean(next[0])){ cur.dates = next.slice(1,8).map(parseDate); r++; }
      continue;
    }
    if (cur && a) cur.rows[a.toLowerCase()] = Array.from({length:7}, (_,i) => clean(row[i+1]));
  }
  weeks.forEach(w => {
    const i = w.dates.findIndex(Boolean);
    w.start = i >= 0 ? addDays(w.dates[i], -i) : null;
    const A = w.rows["wod a"] || [], B = w.rows["wod b"] || [];
    w.filled = A.some(Boolean) || B.some(Boolean);
  });
  return weeks.filter(w => w.filled);
}

function pickToday(){
  const t = new Date(); t.setHours(0,0,0,0);
  let wi = S.weeks.findIndex(w => w.start && t >= w.start && t < addDays(w.start,7));
  let di = 0;
  if (wi >= 0) di = Math.round((t - S.weeks[wi].start) / 864e5);
  else {
    wi = S.weeks.findIndex(w => w.start && w.start > t);
    if (wi < 0) wi = S.weeks.length - 1;
  }
  S.wi = Math.max(0, wi); S.di = Math.min(6, Math.max(0, di));
}

const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const FMT_RE = /^(AMRAP|EMOM|E\d|For time|\d+ rounds|\d+ sets|Teams of|Team|Every|On the|For Time|\d+-\d+)/i;
// ---- 1RM lifts and % → kg ----
const LIFTS = [
  ["back-squat","Back Squat"],["front-squat","Front Squat"],["deadlift","Deadlift"],
  ["press","Strict Press"],["push-press","Push Press"],["jerk","Push / Split Jerk"],
  ["power-clean","Power Clean"],["squat-clean","Squat Clean"],["clean-jerk","Clean & Jerk"],
  ["power-snatch","Power Snatch"],["squat-snatch","Squat Snatch"],["thruster","Thruster"],
  ["ohs","Overhead Squat"],["bench","Bench Press"]
];
const LIFT_NAME = Object.fromEntries(LIFTS);
const LIFT_RES = [
  [/squat\s+clean/i,"squat-clean"],[/squat\s+snatch/i,"squat-snatch"],
  [/clean\s*(?:&|and|\+)\s*jerk/i,"clean-jerk"],
  [/power\s+clean/i,"power-clean"],[/power\s+snatch/i,"power-snatch"],
  [/push\s+press/i,"push-press"],[/(?:push|split)\s+jerk|\bjerk\b/i,"jerk"],
  [/bench\s+press/i,"bench"],[/front\s+squat/i,"front-squat"],[/\bFS\b/,"front-squat"],
  [/overhead\s+squat/i,"ohs"],[/\bOHS\b/,"ohs"],[/thruster/i,"thruster"],
  [/deadlift|\bDL\b/i,"deadlift"],
  [/(?:back|pause[d]?|speed|tempo)\s+(?:back\s+)?squat|^\s*\d*\s*squat\b/i,"back-squat"],
  [/\bclean\b/i,"power-clean"],[/\bsnatch\b/i,"squat-snatch"],
  [/\bpress\b/i,"press"]
];
function liftIn(line){
  if (/\b(DB|dumbbell|KB|kettlebell|goblet|air squat|wall ?ball|sumo deadlift high pull)\b/i.test(line)) return null;
  const of = line.match(/of (?:your|the)\s+([a-z &]+?)(?:$|[,.)])/i);
  const src = of ? of[1] : line;
  for (const [re, id] of LIFT_RES) if (re.test(src)) return id;
  return null;
}
function pctsIn(line){
  let m = line.match(/(\d{2,3}(?:-\d{2,3})+)\s?%/);
  if (m) return m[1].split("-").map(Number);
  const out = [...line.matchAll(/(\d{2,3}(?:[.,]\d)?)\s?%/g)].map(x => parseFloat(x[1].replace(",", ".")));
  if (out.length) return out;
  m = line.match(/\bat\s+(\d{2,3})(?!\s*(?:kg|m\b|cal|\/))/i);
  return m ? [Number(m[1])] : [];
}
const roundKg = kg => Math.round(kg / 2.5) * 2.5;
const fmtKg = kg => (Number.isInteger(kg) ? String(kg) : kg.toFixed(1).replace(".", ","));
function pctChip(lift, pcts){
  const parts = PEOPLE.map(([id,name]) => {
    const max = parseFloat(S.maxes[`${id}:${lift}`]);
    if (!(max > 0)) return "";
    return `${name[0]} <b>${pcts.map(p => fmtKg(roundKg(max * p / 100))).join("/")}</b>`;
  }).filter(Boolean);
  if (!parts.length) return `<button class="pct pct-set" data-lift="${lift}">+ 1RM</button>`;
  return `<button class="pct" data-lift="${lift}" aria-label="${esc(LIFT_NAME[lift])} loads">${parts.join(" · ")}</button>`;
}
function wodHTML(text, notes){
  if (notes) return text.split("\n").map(ln => esc(ln).replace(/^(Echo Bike variation|RPE 5 option|Goal|TC|Strength)(:)/, '<span class="hl">$1$2</span>')).join("\n");
  let ctx = null; const shown = new Set();
  const lines = text.split("\n").map((ln, i) => {
    const e = esc(ln);
    const lift = liftIn(ln); if (lift) ctx = lift;
    const pcts = pctsIn(ln);
    let chip = "";
    if (pcts.length && (lift || ctx) && !(pcts.length === 1 && pcts[0] > 100)) {
      const l = lift || ctx;
      if (S.maxes && !(shown.has(l) && !Object.keys(S.maxes).some(k => k.endsWith(":"+l)))) chip = pctChip(l, pcts);
      shown.add(l);
    }
    if (i === 0 && FMT_RE.test(ln)) return { fmt:true, html:`<span class="fmt">${e}</span>${chip}` };
    return { html: e.replace(/(\d+(?:\.\d+)?\/\d+(?:\.\d+)?\s?(?:kg|cal|m)?'?)/g, '<span class="load">$1</span>') + chip };
  });
  if (lines[0] && lines[0].fmt) return lines[0].html + lines.slice(1).map(l => l.html).join("\n");
  return lines.map(l => l.html).join("\n");
}

function render(){
  const w = S.weeks[S.wi];
  $("prevWk").disabled = S.wi <= 0;
  $("nextWk").disabled = S.wi >= S.weeks.length - 1;
  $("cycleLabel").textContent = S.tab ? "Programming · " + S.tab : "Programming";
  if (!w){
    $("wkTitle").textContent = "No weeks yet";
    $("wkSub").textContent = S.error ? "" : "This cycle has no programmed weeks.";
    $("days").innerHTML = "";
    $("main").innerHTML = S.error ? bannerHTML() : `<div class="empty">Nothing programmed in ${esc(S.tab||"this cycle")} yet. Workouts appear here as soon as they're in the sheet.</div>`;
    return;
  }
  const wf = (w.rows["focus of the week"]||[])[0];
  $("wkTitle").textContent = `Week ${w.no}`;
  $("wkSub").innerHTML = (w.start ? `${fmt(w.start)} – ${fmt(addDays(w.start,6))}` : "") + (wf ? `<span class="wk-focus">${esc(wf)}</span>` : "");

  const today = new Date(); today.setHours(0,0,0,0);
  $("days").innerHTML = DAYS.map((d,i) => {
    const date = w.start ? addDays(w.start,i) : null;
    return `<button class="day${sameDay(date,today)?" today":""}" role="tab" aria-selected="${i===S.di}" data-i="${i}"><b>${d}</b><span>${date?date.getDate():""}</span></button>`;
  }).join("");

  const g = k => (w.rows[k]||[])[S.di] || "";
  const A = g("wod a"), B = g("wod b"), N = g("notes");
  const focus = g("focus of the day"), fn = g("movement function"), skill = g("primary fitness skill");
  const date = w.start ? addDays(w.start, S.di) : null;
  const sunday = S.di === 6;

  let html = S.error ? bannerHTML() : "";
  const pic = dayPic(date);
  if (pic) html += `<div class="daypic"><img src="${esc(pic)}" alt="" onerror="this.parentNode.remove()"></div>`;
  html += `<div class="dayhead"><h1>${DAY_NAMES[S.di]}</h1><div class="chips">${focus?`<span class="chip focus">${esc(focus)}</span>`:""}${fn?`<span class="chip">${esc(fn)}</span>`:""}${skill?`<span class="chip">${esc(skill)}</span>`:""}</div></div>`;
  if (!A && !B) html += `<div class="empty">Rest day, or nothing programmed for ${DAY_NAMES[S.di]}${date?` ${fmt(date)}`:""}.</div>`;
  const WU = ((WARMUPS[S.tab]||{})[w.no]||[])[S.di] || "";
  if (WU && (A || B)) html += warmSlab(WU);
  if (A) html += slab("a","A", sunday && B ? "Hero" : "WOD A", A, false, w);
  if (B) html += slab("b","B", sunday ? "Workout" : "WOD B", B, false, w);
  if (N) html += slab("n","!", "Notes", N, true, w);
  $("main").innerHTML = html;
  loadScores(w);
  $("foot").textContent = S.updated ? `Updated from the sheet ${new Date(S.updated).toLocaleString("de-DE",{weekday:"short",hour:"2-digit",minute:"2-digit"})}` : "";
}
// ---- scores per workout (shared via /api/scores, falls back to this phone only) ----
const PEOPLE = [["pia","Pia"],["henning","Henning"]];
const weekId = w => `${S.tab}|${w.no}`;
const openKey = (w, part) => `${weekId(w)}|${S.di}|${part}`;
S.open = null;
function scoreSummary(w, part){
  const sc = S.scores[weekId(w)] || {};
  const got = PEOPLE.map(([id,name]) => sc[`${S.di}:${part}:${id}`] ? `${name} <b>${esc(sc[`${S.di}:${part}:${id}`])}</b>` : "").filter(Boolean);
  return got.length ? got.join(" · ") : "";
}
function scoreFields(w, part){
  const sc = S.scores[weekId(w)] || {};
  const fields = PEOPLE.map(([id,name]) => {
    const v = sc[`${S.di}:${part}:${id}`] || "";
    return `<div class="score"><label for="score-${part}-${id}">${name}<span class="st" id="st-${part}-${id}"></span></label><input id="score-${part}-${id}" data-part="${part}" data-person="${id}" value="${esc(v)}" placeholder="e.g. 14:32" autocomplete="off" enterkeyhint="done" maxlength="60"></div>`;
  }).join("");
  const hint = S.scoreMode === "local" ? `<div class="score-hint">Saved on this phone only</div>` : "";
  return `<div class="scores">${fields}</div>${hint}`;
}
const scoreLoaded = new Set();
async function loadScores(w){
  const id = weekId(w);
  if (scoreLoaded.has(id)) return;
  scoreLoaded.add(id);
  const local = store.get("scores:"+id) || {};
  S.scores[id] = Object.assign({}, local, S.scores[id] || {});
  try {
    const r = await fetch("/api/scores?" + new URLSearchParams({ week: id }), { cache: "no-store" });
    if (r.status === 501){ S.scoreMode = "local"; }
    else if (r.ok){ const j = await r.json(); S.scores[id] = Object.assign({}, local, j.scores); store.set("scores:"+id, S.scores[id]); }
  } catch (e) {}
  if (S.weeks[S.wi] && weekId(S.weeks[S.wi]) === id && !document.activeElement?.matches?.(".score input")) render();
}
const saveTimers = {};
async function saveScore(part, person, value){
  const w = S.weeks[S.wi]; if (!w) return;
  const id = weekId(w), day = S.di, st = $(`st-${part}-${person}`), field = `${day}:${part}:${person}`;
  S.scores[id] = S.scores[id] || {};
  if (value) S.scores[id][field] = value; else delete S.scores[id][field];
  store.set("scores:"+id, S.scores[id]);
  const sum = document.querySelector(`[data-sum="${part}"]`); if (sum) sum.innerHTML = scoreSummary(w, part);
  if (S.scoreMode === "local"){ if (st) st.textContent = "Saved"; return; }
  try {
    const r = await fetch("/api/scores", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ week:id, day, part, person, value }) });
    if (r.status === 501){ S.scoreMode = "local"; if (st) st.textContent = "Saved"; return; }
    if (st) st.textContent = r.ok ? "Saved" : "Not saved";
  } catch (e) { if (st) st.textContent = "Offline, on phone"; }
}
$("main").addEventListener("input", e => {
  const inp = e.target.closest(".score input"); if (!inp) return;
  const part = inp.dataset.part, p = inp.dataset.person, k = part + p;
  const st = $(`st-${part}-${p}`); if (st) st.textContent = "…";
  clearTimeout(saveTimers[k]);
  saveTimers[k] = setTimeout(() => saveScore(part, p, inp.value.trim()), 700);
});
$("main").addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches(".score input")) e.target.blur(); });
$("main").addEventListener("click", e => {
  if (e.target.closest(".scores")) return;
  const sl = e.target.closest(".slab[data-part]"); if (!sl) return;
  if (window.getSelection && String(window.getSelection()).length) return;
  const w = S.weeks[S.wi]; const k = openKey(w, sl.dataset.part);
  S.open = S.open === k ? null : k;
  render();
  if (S.open){ const inp = document.querySelector(`.slab[data-part="${sl.dataset.part}"] .score input`); if (inp) inp.focus({ preventScroll:false }); }
});

// ---- 1RM store (shared via /api/maxes, falls back to this phone) ----
async function loadMaxes(){
  S.maxes = store.get("maxes") || {};
  try {
    const r = await fetch("/api/maxes", { cache: "no-store" });
    if (r.ok){ const j = await r.json(); S.maxes = Object.assign({}, S.maxes, j.maxes); store.set("maxes", S.maxes); }
  } catch (e) {}
  if (!document.activeElement?.matches?.("input")) render();
}
function openMaxes(focusLift){
  $("rmGrid").innerHTML = `<span></span>` + PEOPLE.map(([,n]) => `<span class="h">${n}</span>`).join("") +
    LIFTS.map(([id,name]) => `<label for="rm-${PEOPLE[0][0]}-${id}">${name}</label>` + PEOPLE.map(([p]) =>
      `<input id="rm-${p}-${id}" data-p="${p}" data-lift="${id}" inputmode="decimal" autocomplete="off" maxlength="6" value="${esc(S.maxes[`${p}:${id}`] || "")}" aria-label="${name} 1RM">`).join("")).join("");
  $("rmSheet").hidden = false;
  const f = focusLift && $(`rm-${PEOPLE[0][0]}-${focusLift}`);
  if (f){ f.scrollIntoView({ block:"center" }); f.focus(); } else $("rmClose").focus();
}
const rmTimers = {};
async function saveMax(p, lift, value, inp){
  value = value.replace(",", ".").trim();
  if (value && !/^\d{1,3}(\.\d{1,2})?$/.test(value)) return;
  if (value) S.maxes[`${p}:${lift}`] = value; else delete S.maxes[`${p}:${lift}`];
  store.set("maxes", S.maxes);
  try {
    const r = await fetch("/api/maxes", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ person:p, lift, value }) });
    if (r.ok || r.status === 501){ inp.classList.add("hit"); setTimeout(() => inp.classList.remove("hit"), 700); }
  } catch (e) {}
}
$("rmGrid").addEventListener("input", e => {
  const inp = e.target; if (!inp.dataset.lift) return;
  const k = inp.id; clearTimeout(rmTimers[k]);
  rmTimers[k] = setTimeout(() => saveMax(inp.dataset.p, inp.dataset.lift, inp.value, inp), 600);
});
const closeMaxes = () => { $("rmSheet").hidden = true; render(); };
$("rmBtn").onclick = () => openMaxes();
$("rmClose").onclick = closeMaxes;
$("rmSheet").addEventListener("click", e => { if (e.target === $("rmSheet")) closeMaxes(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("rmSheet").hidden) closeMaxes(); });
$("main").addEventListener("click", e => {
  const b = e.target.closest(".pct"); if (!b) return;
  e.stopPropagation(); openMaxes(b.dataset.lift);
}, true);

const warmSlab = text => {
  const lines = text.split("\n"); let head = "Warm up";
  if (/^\d+\s?min$/i.test(lines[0].trim())){ head += " · " + lines.shift().trim(); }
  return `<section class="slab warm"><div class="plate w" aria-hidden="true">W</div><div class="slab-body"><div class="slab-label">${esc(head)}</div><div class="wod">${lines.map(esc).join("\n")}</div></div></section>`;
};
const slab = (cls, mark, label, text, notes, w) => {
  if (notes) return `<section class="slab notes"><div class="plate ${cls}" aria-hidden="true">${mark}</div><div class="slab-body"><div class="slab-label">${label}</div><div class="wod">${wodHTML(text, true)}</div></div></section>`;
  const open = S.open === openKey(w, cls);
  const sum = scoreSummary(w, cls);
  return `<section class="slab tap${open?" open":""}" data-part="${cls}"><div class="plate ${cls}" aria-hidden="true">${mark}</div><div class="slab-body"><div class="slab-row"><div class="slab-label">${label}</div><button class="score-btn" aria-expanded="${open}">${open ? "Done" : (sum ? "Edit score" : "+ Score")}</button></div><div class="wod">${wodHTML(text, false)}</div><div class="score-sum" data-sum="${cls}">${open ? "" : sum}</div>${open ? scoreFields(w, cls) : ""}</div></section>`;
};

function bannerHTML(){
  const e = S.error; if (!e) return "";
  const msgs = {
    sheet_error: ["Couldn't load the workouts", e.message || "Tap refresh to try again."],
    bad_tab: ["That cycle tab wasn't found", "Pick another cycle."],
    offline: ["You're offline", "Showing the last loaded copy. Tap refresh when you have signal."]
  };
  const [t, d] = msgs[e.code] || ["Couldn't load the sheet", "Showing the last loaded copy if there is one. Tap refresh to try again."];
  return `<div class="banner" role="status"><b>${esc(t)}</b>${esc(d)}</div>`;
}

function applyValues(values, storedAt){
  const keepPos = S.picked && S.weeks.length;
  const prevNo = keepPos ? S.weeks[S.wi]?.no : null;
  S.weeks = parseSheet(values || []);
  S.updated = storedAt || Date.now();
  S.error = null;
  if (prevNo != null){ const i = S.weeks.findIndex(w => w.no === prevNo); if (i >= 0) S.wi = i; else pickToday(); }
  else pickToday();
  store.set("werk:"+S.tab, { values, at:S.updated });
  render();
}

let DATA = null, WARMUPS = {}, PICS = {};
fetch("/img/days.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => { PICS = j || {}; if (S.weeks.length && !document.activeElement?.matches?.("input")) render(); }).catch(() => {});
const WD_KEYS = ["mon","tue","wed","thu","fri","sat","sun"];
// Random picture per day: same for everyone on that date, no repeats within a week (while the pool has 7+).
function seeded(seed){ let x = seed >>> 0 || 1; return () => { x ^= x << 13; x >>>= 0; x ^= x >> 17; x ^= x << 5; x >>>= 0; return x / 4294967296; }; }
function dayPic(date){
  const pool = Array.isArray(PICS.pool) ? PICS.pool : [];
  if (!pool.length || !date) return null;
  const monday = addDays(date, -S.di);
  const seed = monday.getFullYear() * 10000 + (monday.getMonth() + 1) * 100 + monday.getDate();
  const rnd = seeded(seed), order = pool.slice();
  for (let i = order.length - 1; i > 0; i--){ const j = Math.floor(rnd() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  return order[S.di % order.length];
}
fetch("/warmups.json", { cache: "no-store" }).then(r => r.ok ? r.json() : {}).then(j => { WARMUPS = j || {}; if (S.weeks.length && !document.activeElement?.matches?.("input")) render(); }).catch(() => {});
async function getData(fresh){
  if (DATA && !fresh) return DATA;
  let r;
  try { r = await fetch("/data.json", { cache: "no-store" }); }
  catch (e) { throw { code: "offline" }; }
  if (!r.ok) throw { code: "sheet_error", message: "data.json could not be loaded." };
  DATA = await r.json();
  return DATA;
}
async function api(params){
  const d = await getData(!params.list);
  if (params.list) return { tabs: Object.keys(d.tabs) };
  if (!d.tabs[params.tab]) throw { code: "bad_tab" };
  return { values: d.tabs[params.tab], updated: d.updated };
}

async function load(manual){
  const btn = $("refresh"); btn.classList.add("spin");
  try {
    const j = await api({ tab: S.tab });
    if (manual) S.picked = true;
    applyValues(j.values, Date.parse(j.updated) || undefined);
  } catch (e) { S.error = e; render(); }
  finally { btn.classList.remove("spin"); }
}

function showTab(){
  S.picked = false;
  const cached = store.get("werk:"+S.tab);
  if (cached){ S.weeks = parseSheet(cached.values); S.updated = cached.at; pickToday(); }
  else S.weeks = [];
  render();
  load(false);
}

function fillTabs(){
  $("tabSel").innerHTML = S.tabs.map(t => `<option${t===S.tab?" selected":""}>${esc(t)}</option>`).join("");
}

$("days").addEventListener("click", e => { const b = e.target.closest(".day"); if (!b) return; S.di = +b.dataset.i; S.picked = true; render(); });
$("prevWk").onclick = () => { if (S.wi > 0){ S.wi--; S.di = 0; S.picked = true; render(); } };
$("nextWk").onclick = () => { if (S.wi < S.weeks.length-1){ S.wi++; S.di = 0; S.picked = true; render(); } };
$("refresh").onclick = () => load(true);
$("tabSel").onchange = e => { S.tab = e.target.value; store.set("werk:tab", S.tab); showTab(); };

// swipe between days
let sx = null, sy = null;
$("main").addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
$("main").addEventListener("touchend", e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > Math.abs(dx)) return;
  S.picked = true;
  if (dx < 0){ if (S.di < 6) S.di++; else if (S.wi < S.weeks.length-1){ S.wi++; S.di = 0; } }
  else { if (S.di > 0) S.di--; else if (S.wi > 0){ S.wi--; S.di = 6; } }
  render();
});

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") load(false); });

// Add to Home Screen: native prompt on Android/Chrome, step-by-step sheet on iPhone (Safari has no install API).
(function(){
  const standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
  if (standalone) return;
  const btn = $("installBtn"), sheet = $("installSheet");
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const iosOther = ios && /CriOS|FxiOS|EdgiOS/.test(ua);
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; btn.hidden = false; });
  window.addEventListener("appinstalled", () => { btn.hidden = true; deferred = null; });
  if (ios) btn.hidden = false;
  const share = '<svg class="glyph" viewBox="0 0 24 24"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 11v9h14v-9"/></svg>';
  const plus = '<svg class="glyph" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
  function steps(){
    if (ios) return [
      iosOther ? `Tap the share button ${share} in the address bar.` : `Tap the share button ${share} at the bottom of Safari.`,
      `Scroll down and tap <b>Add to Home Screen</b> ${plus}.`,
      `Tap <b>Add</b>. CheezyWednesday Programming now opens from its own icon.`
    ];
    return [`Open your browser menu (⋮).`, `Tap <b>Install app</b> or <b>Add to Home screen</b>.`];
  }
  btn.onclick = async () => {
    if (deferred){ deferred.prompt(); try { await deferred.userChoice; } catch(e){} deferred = null; return; }
    $("sheetSteps").innerHTML = steps().map(s => `<li>${s}</li>`).join("");
    sheet.hidden = false; $("sheetClose").focus();
  };
  const close = () => { sheet.hidden = true; btn.focus(); };
  $("sheetClose").onclick = close;
  sheet.addEventListener("click", e => { if (e.target === sheet) close(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) close(); });
})();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});

(async function boot(){
  S.tab = store.get("werk:tab") || "Fall 2026";
  S.tabs = [S.tab]; fillTabs();
  showTab();
  loadMaxes();
  try {
    const j = await api({ list: "tabs" });
    if (j.tabs && j.tabs.length){
      S.tabs = j.tabs;
      if (!S.tabs.includes(S.tab)){ S.tab = S.tabs[0]; showTab(); }
      fillTabs();
    }
  } catch (e) {}
})();
</script>
